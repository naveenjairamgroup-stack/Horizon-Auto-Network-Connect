<div class="card">
  <h2>Add commission rule</h2>
  <form id="new-commission-rule-form">
    <div class="form-row">
      <div><label>Vehicle model</label><input id="cr-model" required></div>
      <div>
        <label>Type</label>
        <select id="cr-type">
          <option value="Fixed">Fixed (&#8377; per vehicle)</option>
          <option value="Percentage">Percentage (of sale value)</option>
        </select>
      </div>
      <div><label>Rate</label><input id="cr-rate" type="number" step="0.01" required></div>
      <div><label>Effective date</label><input id="cr-effective" type="date" required></div>
    </div>
    <button type="submit">Add rule</button>
  </form>
</div>

<div class="card">
  <h2>Calculate monthly commission</h2>
  <form id="calc-commission-form">
    <div class="form-row">
      <div><label>Dealer code</label><input id="cc-dealer-code" required></div>
      <div><label>Month (YYYY-MM)</label><input id="cc-month" placeholder="2026-07" required></div>
    </div>
    <button type="submit">Calculate &amp; post to ledger</button>
  </form>
</div>

<div class="card">
  <h2>Commission entries for this dealer</h2>
  <table>
    <thead><tr><th>Dealer</th><th>Month</th><th>Retail count</th><th>Amount</th></tr></thead>
    <tbody id="commission-table-body"></tbody>
  </table>
</div>
